name: Image Backfill (Playwright)

# Mengisi gambar chapter ke R2 via browser nyata (lolos Cloudflare).
# Laptop TIDAK diperlukan — berjalan di runner GitHub (repo public = gratis).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Jumlah chapter per run'
        default: '30'
      minutes:
        description: 'Time-box (menit)'
        default: '25'
      lanes:
        description: 'Jumlah lane browser paralel'
        default: '2'
      covers:
        description: 'Jumlah cover mati yang direhost per run (0=off)'
        default: '10'
      chapters:
        description: 'Jumlah manga tanpa chapter yang diimport daftar chapternya (0=off)'
        default: '3'
  # 12x/hari tiap 2 jam sejak 2026-10-04 (mode GitHub-only, laptop bebas):
  # backlog ±8.7k chapter → ±360/hari (12 run × 30) → tuntas ±3,5-4 minggu.
  # Setelah backlog habis, turunkan kembali ke 6x/hari ('30 */4 * * *').
  schedule:
    - cron: '30 */2 * * *'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run image backfill
        run: node scripts/image-backfill.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          LIMIT: ${{ inputs.limit || '30' }}
          MINUTES: ${{ inputs.minutes || '25' }}
          LANES: ${{ inputs.lanes || '2' }}
          COVER_LIMIT: ${{ inputs.covers || '10' }}
          CHAPTERS_LIMIT: ${{ inputs.chapters || '3' }}